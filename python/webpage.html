<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Hub</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="nav-left">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation Sidebar">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="logo">
        <span class="logo-icon">📦</span>
        <span class="logo-text">Resource Hub</span>
      </div>
    </div>

    <div class="nav-center">
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="searchInput" placeholder="Search resources, tags, topics..." autocomplete="off">
        <span class="search-shortcut">Ctrl K</span>
      </div>
    </div>

    <div class="nav-right">
      <button class="btn btn-outline" id="themeToggle" aria-label="Toggle Theme">
        <span id="themeIcon">🌙</span>
      </button>
      <button class="btn btn-primary" id="openModalBtn">
        <span>+ Add Resource</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-layout">

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <h4 class="sidebar-title">Categories</h4>
        <nav class="sidebar-nav" id="sidebarNav">
          <!-- Dynamically populated categories -->
        </nav>
      </div>

      <div class="sidebar-section">
        <h4 class="sidebar-title">Quick Stats</h4>
        <div class="stats-card">
          <div class="stat-item">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Resources</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="statCategories">0</span>
            <span class="stat-label">Categories</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
      <!-- Tag / Filter Bar -->
      <div class="filter-bar" id="tagContainer">
        <!-- Dynamically populated tag filters -->
      </div>

      <!-- Category Title & Description -->
      <div class="section-header">
        <div>
          <h2 id="currentCategoryTitle">All Resources</h2>
          <p id="currentCategoryDesc" class="text-muted">Explore and access curated resources, code snippets, and guides.</p>
        </div>
      </div>

      <!-- Resource Cards Grid -->
      <div class="resource-grid" id="resourceGrid">
        <!-- Dynamically populated resource cards -->
      </div>

      <!-- Empty State View -->
      <div class="empty-state hidden" id="emptyState">
        <div class="empty-icon">🔍</div>
        <h3>No resources found</h3>
        <p class="text-muted">Try adjusting your search query or select a different category filter.</p>
        <button class="btn btn-outline" id="clearFiltersBtn">Clear Filters</button>
      </div>
    </main>

  </div>

  <!-- Add Resource Modal -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h3>Add New Resource</h3>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <form id="addResourceForm" class="modal-body">
        <div class="form-group">
          <label for="resTitle">Title *</label>
          <input type="text" id="resTitle" placeholder="e.g. Official Python Documentation" required>
        </div>
        
        <div class="form-group">
          <label for="resCategory">Category *</label>
          <input type="text" id="resCategory" placeholder="e.g. Python, Web Dev, Tools" required>
        </div>

        <div class="form-group">
          <label for="resType">Content Format</label>
          <select id="resType">
            <option value="link">External Link / Website</option>
            <option value="code">Code Snippet Block</option>
            <option value="cheatsheet">Cheatsheet / Table</option>
          </select>
        </div>

        <div class="form-group">
          <label for="resDesc">Description *</label>
          <textarea id="resDesc" rows="3" placeholder="Brief summary of what this resource provides..." required></textarea>
        </div>

        <div class="form-group" id="urlGroup">
          <label for="resUrl">Resource URL</label>
          <input type="url" id="resUrl" placeholder="https://example.com">
        </div>

        <div class="form-group hidden" id="codeGroup">
          <label for="resCode">Code Snippet</label>
          <textarea id="resCode" rows="4" placeholder="Paste your code snippet here..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Resource</button>
        </div>
      </form>
    </div>
  </div>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
